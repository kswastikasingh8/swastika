 <!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="utf-8"/> 
  <title>Experiment 6</title> 
  <link rel="stylesheet" href="style.css"> 
  <style>
  body { background: #f7f8fb; color: #111; padding: 20px; }
  .site-header { 
  display: block;                 
  background: #4d0054; 
  color: #fff; 
  padding: 12px; 
  text-align: center; 
  margin-bottom: 18px;       }
.container { max-width: 800px; height:800px; margin: 0 auto; }
.product-image { 
  width: 100%;                    
  height: 200px;                  
  object-fit: cover; 
  display: block;                  
  margin-bottom: 10px; 
  border: 1px solid #ddd; }         
.product-title { 
  font-size: 18px;                 
  margin-bottom: 6px; 
}
.product-desc { 
  font-size: 14px; 
  color: #444;                     
  margin-bottom: 10px; 
}
.price-row { margin-bottom: 12px; } 
.price { 
  font-weight: 700; 
  color: #0b6b3a; 
  margin-right: 8px;               
  display: inline;                
  .old-price { 
  color: #888; 
  text-decoration: line-through; 
  display: inline;  }              
}
.add-cart { 
  display: block;                  
  width: 100%;                     
  padding: 10px;                  
  background: #004f9f;             
  color: #fff; 
  border: none; 
  border-radius: 4px;              
  cursor: pointer; 
  font-size: 16px;                 
}
.product-image { width:250px; height: 500px; } 

  </style>
</head> 
<body> 
 
  <header class="site-header"> 
    <h1>ShowStopper</h1> 
  </header> 
 
  <main class="container"> 
    <section class="product-card"> 
      <img class="product-image" src="https://th.bing.com/th/id/OIP._kDNu1QEPwfiRv4IxDXpYAHaLH?w=204&h=306&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Dress"> 
      <h2 class="product-title">Bodycon Full Length Dress</h2> 
      <p class="product-desc">Soft, breathable cotton. Bodycon fit. Available in multiple colors.</p> 
 
      <div class="price-row"> 
        <span class="price">₹1,699</span> 
        <span class="old-price">₹1,999</span> 
      </div> 
 
      <button class="add-cart">Add to Cart</button> 
    </section> 
  </main> 
 
</body> 
</html>
