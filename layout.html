<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            }
        html *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #main {
            width: 1000px;
            height: 800px;
            background-color: #eee5e5;
            margin: 0 auto; /* to center align the div */
            flex-direction: row;
            display: flex;
            align-items: flex-end;
            align-content: center;
            justify-content: space-between;
            gap: 10px;

        }
        .box {
            width: 200px;
            height: 300px;
            background-color: #F04;
    }
    </style>
</head>

<body>
    <!-- write div#main and enter it will get automatically written: id and all -->
   <div id="main">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
</body>
</html>
