<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Grid container was missing; without this, grid placements like grid-column/grid-row do nothing */
        .container {
            display: grid;
            /* create 7 columns because your grid-column uses 1/8 (index 8 is exclusive) */
            grid-template-columns: repeat(7, 1fr);
            /* rows are 100px tall by default -- change as needed */
            grid-auto-rows: 100px;
            gap: 10px;
            width: 90%;
            margin: 20px auto;
        }
        .item {
            background: #04929459;
            border: 1px solid #ccc;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .item1 
        {
            grid-column: 1/8;
            grid-row: 1/2;
        }
        .item2 
        {
            grid-column: 1/3;
            grid-row: 2/4;
        }
        .item3 
        {
            grid-column: 3/8;
            grid-row: 2/4;
        }
        .item4 
        {
            grid-column: 1/4;
            grid-row: 4/5;
        }
        .item5 
        {
            grid-column: 4/8;
            grid-row: 4/5;
        }
        .item6 
        {
            grid-column: 1/8;
            grid-row: 5/6;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="item item1">Header</div>
    <div class="item item2">Side Content</div>
    <div class="item item3">Main Content</div>
    <div class="item item4">Content 1</div>
    <div class="item item5">Content 2</div>
    <div class="item item6">Footer</div>
    </div>
</body>
</html>
