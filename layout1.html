
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        html *{
            margin: 0;
            padding: 0;
        }
        #main {
            width: 900px;
            height: 1000px;
            background-color: #999;
            margin: 0 auto;
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;
        }
        #right {
            flex-grow: 1;
            height: 100px;
            background-color: #888;
        }
        #left {
            flex-grow: 2;
            height: 100px;
            background-color: #888;

        }
        #header, #main, #footer {
            height: 200px;
            background-color: #999;
            margin: 5px;
        }
        </style>
</head>
<body>
    <div id="main">
        <div id="right">
            <h2>Right Box</h2>
            </div>

        <div id="left">
            <h2>Left Box</h2>
            <header><h2>Header</h2></header>
            <main><h2>Main Content</h2></main>
            <footer><h2>Footer</h2></footer>
        
        </div>
</body>
</html>
