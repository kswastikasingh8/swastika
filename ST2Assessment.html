<!DOCTYPE html>
<html>
<head>
<title>Responsive Product Grid</title>
<style>
*{ margin:0;
padding:0;
box-sizing: border-box;
}
body{
font-family: Sans-Serif
background color: rgb(100,100,100)
}
.nav bar{
display: flex;
justify-content: space-between;
align itmes: corner;
background color: rgba(10,100,20,0.4)
}
.logo{
font-size:1.5rem;
font-weight: bold;
color: white;
}
.nav-links{
display: flex;
list-style: none;
gap:1.5rem;
}
.nav-links li a{
color: white;
text-decoration: none;
font-weight:500;
}
.nav icons{
display: flex;
gap:1rem;
}
.nav-icons .icon{
text-decoration: none;
font-weight: 500;
}
.welcome-section {
text-align: center;
padding: 4rem 2rem;
background-color: #ffffff;
}
.welcome-section h1 {
font-size: 2.5rem;
margin-bottom: 1rem;
color: #0077cc;
}
.welcome-section p {
font-size: 1.2rem;
color: #555;
}
@media (max-width: 768px) {
.nav-links {
flex-direction: column;
width: 100%;
margin-top: 1rem;
}
.nav-icons {
width: 100%;
justify-content: center;
margin-top: 1rem;
}
.navbar {
flex-direction: column;
align-items: flex-start;
}
.welcome-section h1 {
font-size: 2rem;
}
.welcome-section p {
font-size: 1rem;
}
}
</style>
<body>
<header>
<nav class="navbar">
<div class="logo">ShopEase</div>
<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Categories</a></li>
<li><a href="#">Deals</a></li>
<li><a href="#">Contact Us</a></li>
</ul>
<div class="nav-icons">
<a href="#" class="icon">Cart</a>
<a href="#" class="icon">Login</a>
</div>
</nav>
</header>
<main class="Welcome-Selection">
<h1>Welcome to ShopEase!</h1>
<p>Your one-stop destination for all shopping needs.</p>
</main>
</body>
</html>
